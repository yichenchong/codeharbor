<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  CodeHarbor trusted editor page (SPEC 8.1). Copied verbatim into dist/ by
  build.mjs and embedded as qrc:/codeharbor/web/editor/index.html (see
  src/qml/CMakeLists.txt), which is what src/qml/EditorPaneView.qml navigates to.

  SECURITY: the page runs on the PRIVILEGED internal WebEngine profile, so its
  CSP is deliberately tight. Only same-origin (qrc:) scripts load — that is this
  bundle plus Qt's own qwebchannel.js — and there is NO inline script at all
  (the bundle boots itself on DOMContentLoaded). Monaco injects theme rules as
  <style> elements at runtime, hence 'unsafe-inline' for styles only; the
  codicon font is inlined as a data: URI by the build. Monaco's editor worker is
  a same-origin sibling script, hence worker-src 'self'. base-uri and
  form-action are NOT covered by default-src, so they are denied explicitly: a
  <base> element would re-point every relative URL on the page (including the
  worker's), and a form submission would navigate this privileged page away.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>CodeHarbor Editor</title>
<link rel="stylesheet" href="editor.css">
<style>
    /* COLOUR MIRROR: these variables are the roles published by
       src/qml/Theme.qml. The values below are the standalone dark fallback;
       EditorPaneView calls window.applyTheme(Theme.roles) after the page loads
       and again when the user's appearance setting changes. Keeping defaults
       here means a page never flashes an unstyled white document and remains
       usable in a standalone bundle test without a QML host. */
    :root {
        --ch-surface-sunken: #11111b;
        --ch-surface-deep: #181825;
        --ch-surface-raised: #313244;
        --ch-border: #45475a;
        --ch-border-subtle: #313244;
        --ch-text: #cdd6f4;
        --ch-text-dim: #6c7086;
        --ch-accent: #89b4fa;
        --ch-warning: #f9e2af;
    }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    /* surfaceSunken / text: the same pair the terminal page uses, so an editor
       pane and a terminal pane read as the same application rather than as a
       terminal beside a transplanted VS Code. */
    body { background: var(--ch-surface-sunken); color: var(--ch-text); }
    /* Column layout: a thin status strip above a surface that takes all
       remaining height. Monaco lays itself out from the surface's box, so that
       box needs a definite height — hence flex:1 + min-height:0. The script
       (src/index.ts) builds these elements and owns only ONE style itself,
       whether the notice is currently showing. */
    #ch-editor-root { height: 100%; width: 100%; display: flex; flex-direction: column; }
    .ch-editor-status {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 8px;
        background: var(--ch-surface-deep);
        border-bottom: 1px solid var(--ch-border-subtle);
        color: var(--ch-text);
        font: 12px/1.6 system-ui, sans-serif;
    }
    /* Pushed to the far end of the strip; shown by the script as display:flex.
       The notice only ever appears for a FAILED save (conflict or error), so it
       carries Theme.warning as its text colour. */
    .ch-editor-notice { margin-left: auto; gap: 6px; align-items: center; color: var(--ch-warning); }
    /* Without these the Reload / Overwrite / Retry buttons the script creates
       fall back to Chromium's native button chrome — a light grey slab with a
       bevel, on a dark status strip, in an application that styles every other
       control itself. The colours are the same Theme roles the rest of this
       page mirrors. */
    .ch-editor-notice button {
        font: inherit;
        color: var(--ch-text);
        background: var(--ch-surface-raised);
        border: 1px solid var(--ch-border);
        border-radius: 4px;             /* radiusSmall */
        padding: 0 8px;
        cursor: pointer;
    }
    .ch-editor-notice button:hover { background: var(--ch-border); }
    .ch-editor-notice button:focus-visible { outline: 1px solid var(--ch-accent); }
    .ch-editor-surface { flex: 1 1 auto; min-height: 0; }

    /* ---- scrollbars ----------------------------------------------------
       These rules reach the PAGE's scrollbars (the status strip, and any
       overflowing Monaco widget that scrolls natively such as the suggestion
       list). Monaco's own editor scrollbars are NOT browser scrollbars: it
       draws them itself, so they are configured in src/index.ts through the
       editor's `scrollbar` options and the "codeharbor-dark" theme's
       scrollbarSlider colours. Both halves have to be set or the pane still
       shows a foreign-looking bar somewhere.

       The ::-webkit-scrollbar family is used rather than the standard
       `scrollbar-color`/`scrollbar-width` pair, and the choice is exclusive:
       Chromium ignores the legacy pseudo-elements on any element that also
       specifies a standard property, so the two cannot be combined. The
       pseudo-elements are what can express the design — an exact 10px width
       (Theme.scrollBarThickness), a fully transparent track, a rounded thumb —
       whereas `scrollbar-width` offers only `auto`/`thin`. This page runs only
       inside Qt WebEngine (Chromium), so the vendor prefix costs no
       portability. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }   /* scrollBarThickness */
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-corner { background: transparent; }
    ::-webkit-scrollbar-thumb {
        background: var(--ch-border);
        border-radius: 4px;   /* radiusSmall */
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--ch-text-dim); }
</style>
</head>
<body>
<div id="ch-editor-root"></div>
<!-- Served by Qt WebChannel itself; provides the global QWebChannel ctor. -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="editor.js"></script>
</body>
</html>
