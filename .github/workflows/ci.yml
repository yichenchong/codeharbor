name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  remote:
    name: remote (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install remote workspace deps
        working-directory: remote
        run: npm install
      - name: Typecheck
        working-directory: remote
        run: npm run typecheck
      - name: Test
        working-directory: remote
        run: npm test

  client:
    name: client (qt/cmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.*"
          # qtpositioning is NOT optional: Qt6WebEngineCore hard-depends on it, and
          # without it find_package(Qt6 COMPONENTS WebEngineCore) fails at configure
          # even though Qt6WebEngineCoreConfig.cmake is present.
          modules: qtwebengine qtwebchannel qtpositioning
      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssh-dev
      # The Monaco bundle is a gitignored build artifact that src/qml/CMakeLists.txt
      # embeds as a Qt resource AT CONFIGURE TIME. It must exist before `cmake
      # --preset dev` or CMake only warns and produces a client whose editor pane
      # has nothing to load - a silently broken editor, not a build failure.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build web bundles (must precede CMake configure)
        run: npm install && npm run build --workspace src/web/editor
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: Configure + build (release preset)
        run: cmake --preset release && cmake --build --preset release
