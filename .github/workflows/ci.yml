name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: neither job publishes anything, and the release
# workflow's publish job grants itself `contents: write` explicitly.
permissions:
  contents: read

# A PR that is pushed to repeatedly would otherwise keep several full Qt +
# WebEngine builds running against superseded commits. Supersede them instead.
# Pushes to `main` are NOT cancelled: the windows-vcpkg-cache job below only
# runs there, and cancelling it would leave the shared dependency cache cold.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remote:
    name: remote (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # ~/.npm across runs. Every job here installs the SAME root lockfile
          # (npm resolves the workspace root even from remote/), and the client
          # job's share of it is Monaco plus esbuild - tens of megabytes fetched
          # from the registry on every single run without this.
          cache: npm
      # BEFORE npm ci: `npm ci` rewrites a workspace package.json's own
      # `version` field to whatever package-lock.json says, so running this
      # afterwards would be reading a manifest npm had already "corrected".
      - name: Versions agree across CMakeLists, manifests and the lock
        # package-lock.json records the version of the root package and of every
        # workspace, and nothing updates it automatically, so it silently drifted
        # a full release behind the manifests (lock 0.1.7 vs manifests 0.1.8).
        # `npm ci` does not complain - it just installs the stale version, which
        # then ships inside the released remote tarball's package.json.
        run: node .github/scripts/check-versions.mjs
      - name: Install remote workspace deps
        working-directory: remote
        # npm ci installs exactly what package-lock.json records, and fails if
        # the lock cannot satisfy the manifests' DEPENDENCY ranges. It does NOT
        # police the `version` fields - that is the step above.
        run: npm ci
      - name: Typecheck
        working-directory: remote
        run: npm run typecheck
      - name: Test
        working-directory: remote
        run: npm test

  # Release tags cannot restore a cache written by another tag. Warm the
  # Windows dependency cache on the default branch so release jobs do not
  # rebuild OpenSSL from source on every tag.
  windows-vcpkg-cache:
    if: github.event_name == 'push'
    name: windows (vcpkg cache)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve cache key
        id: imgver
        shell: pwsh
        run: |
          echo "v=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          echo "vcpkg=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_OUTPUT
          $pin = (Get-Content packaging/vcpkg-ports/libssh/vcpkg.json | ConvertFrom-Json).version
          echo "libssh=$pin" >> $env:GITHUB_OUTPUT
      # cache/restore, NOT the combined `actions/cache` action: the combined one
      # registers its own post-job save under the same key, which then races the
      # explicit save step below and logs a "cache already exists" failure. The
      # explicit save is the one we want, because it runs as soon as the build
      # succeeds rather than at the very end of the job.
      - name: Restore vcpkg libssh cache
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.imgver.outputs.vcpkg }}\installed
          key: vcpkg-libssh-${{ steps.imgver.outputs.libssh }}-x64-windows-${{ steps.imgver.outputs.v }}
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install libssh via vcpkg
        shell: pwsh
        env:
          LIBSSH_PIN: ${{ steps.imgver.outputs.libssh }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:VCPKG_INSTALLATION_ROOT
          $header = "$root/installed/x64-windows/include/libssh/libssh_version.h"
          if (Test-Path $header) {
            $text = Get-Content $header -Raw
            $parts = "MAJOR", "MINOR", "MICRO" | ForEach-Object {
              [regex]::Match($text, "LIBSSH_VERSION_$_\s+(\d+)").Groups[1].Value
            }
            $present = $parts -join "."
            if ($present -ne $env:LIBSSH_PIN) {
              vcpkg remove libssh:x64-windows --recurse
            }
          }
          vcpkg install libssh:x64-windows "--overlay-ports=$(Resolve-Path packaging/vcpkg-ports)"
          $text = Get-Content $header -Raw
          $parts = "MAJOR", "MINOR", "MICRO" | ForEach-Object {
            [regex]::Match($text, "LIBSSH_VERSION_$_\s+(\d+)").Groups[1].Value
          }
          if (($parts -join ".") -ne $env:LIBSSH_PIN) {
            throw "cached libssh version is not the pinned version"
          }
      - name: Save vcpkg libssh cache
        if: steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.imgver.outputs.vcpkg }}\installed
          key: vcpkg-libssh-${{ steps.imgver.outputs.libssh }}-x64-windows-${{ steps.imgver.outputs.v }}

  client:
    name: client (qt/cmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          # qtpositioning is NOT optional: Qt6WebEngineCore hard-depends on it, and
          # without it find_package(Qt6 COMPONENTS WebEngineCore) fails at configure
          # even though Qt6WebEngineCoreConfig.cmake is present.
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssh-dev
      # The Monaco and xterm.js bundles are gitignored build artifacts that
      # src/qml/CMakeLists.txt embeds as Qt resources AT CONFIGURE TIME. CMake
      # refuses to configure without them (FATAL_ERROR, unless
      # -DCODEHARBOR_SKIP_WEB_BUNDLE=ON), so building them here is what keeps the
      # configure step below from failing outright.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # BOTH bundles, via the root workspaces script. Naming only the editor left
      # the terminal bundle to CMake's npm fallback, which is a convenience for
      # local dev and is not portable - it failed outright on the Windows runner.
      - name: Build web bundles (must precede CMake configure)
        # npm ci requires an up-to-date package-lock.json (installs from it strictly).
        run: npm ci && npm run build
      # BD24: type-check both web bundles. esbuild strips types without checking
      # them, so a TS error anywhere in src/web/* would otherwise reach a shipped
      # bundle unreported. The root workspaces script runs tsc --noEmit across the
      # editor and terminal packages; a type error here fails CI before configure.
      - name: Typecheck web bundles
        run: npm run typecheck
      # The web bundles ship real logic (Monaco language selection, unsaved-work
      # snapshots, terminal visibility) with node --test suites next to them.
      # Nothing ran them before: the `remote` job only tests remote/, and this
      # job only type-checked. A regression in either bundle reached a release.
      - name: Test web bundles
        run: npm test --workspace src/web/terminal --workspace src/web/editor
      - name: Configure (release preset, tests on)
        run: cmake --preset release-tests
      - name: Build
        run: cmake --build --preset release-tests
      - name: Test
        run: ctest --preset release-tests --output-on-failure
