name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: neither job publishes anything, and the release
# workflow's publish job grants itself `contents: write` explicitly.
permissions:
  contents: read

jobs:
  remote:
    name: remote (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install remote workspace deps
        working-directory: remote
        run: npm install
      - name: Typecheck
        working-directory: remote
        run: npm run typecheck
      - name: Test
        working-directory: remote
        run: npm test

  client:
    name: client (qt/cmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          # qtpositioning is NOT optional: Qt6WebEngineCore hard-depends on it, and
          # without it find_package(Qt6 COMPONENTS WebEngineCore) fails at configure
          # even though Qt6WebEngineCoreConfig.cmake is present.
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssh-dev
      # The Monaco and xterm.js bundles are gitignored build artifacts that
      # src/qml/CMakeLists.txt embeds as Qt resources AT CONFIGURE TIME. CMake
      # refuses to configure without them (FATAL_ERROR, unless
      # -DCODEHARBOR_SKIP_WEB_BUNDLE=ON), so building them here is what keeps the
      # configure step below from failing outright.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # BOTH bundles, via the root workspaces script. Naming only the editor left
      # the terminal bundle to CMake's npm fallback, which is a convenience for
      # local dev and is not portable - it failed outright on the Windows runner.
      - name: Build web bundles (must precede CMake configure)
        run: npm install && npm run build
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure
      - name: Configure + build (release preset)
        run: cmake --preset release && cmake --build --preset release
