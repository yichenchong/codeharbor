name: Release

# Cross-OS binaries are produced by building NATIVELY on each OS. Qt WebEngine
# (Chromium) cannot be cross-compiled, so there is one runner per target OS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false

# Only `publish` needs write access, and it grants itself `contents: write`
# below. Everything else (three OS builders + the remote packager) is read-only.
permissions:
  contents: read

env:
  # Must be >= the CMake floor (6.9). 6.8.1 predates
  # QQuickWebEngineProfile(storageName, parent) and does not compile.
  QT_VERSION: "6.9.*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # qtpositioning is a hard dependency of Qt6WebEngineCore; omitting it
          # fails find_package(Qt6 COMPONENTS WebEngineCore) at configure time.
          #
          # qtserialport is needed only to PACKAGE, not to build: installing
          # qtpositioning makes linuxdeploy's qt plugin bundle the position
          # plugins, and libqtposition_nmea.so links libQt6SerialPort.so.6.
          # Without it the AppImage step dies on an unresolved dependency.
          modules: qtwebengine qtwebchannel qtpositioning qtserialport
          cache: true

      # Pinned, not `@latest`: get-cmake's `latest` tag moves with every CMake
      # release, so a floating ref silently changes the CMake that builds the
      # published artifacts. v4.2.3 is the version docs/DEVELOPMENT.md records as
      # verified for this tree; bump it deliberately, together with that table.
      - name: Install CMake + Ninja
        uses: lukka/get-cmake@v4.2.3

      # --- libssh per platform -------------------------------------------------
      - name: Install libssh (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Install libssh (macOS)
        if: matrix.name == 'macos'
        run: |
          brew install libssh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libssh):${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

      # libssh is built FROM SOURCE by vcpkg and dominated this job at ~9.8 min
      # of a 13.7 min run (the compile itself is ~1.6 min). The built tree is
      # deterministic for a given triplet, so cache it; a hit turns the install
      # below into a no-op.
      #
      # SCOPING: a run can only restore a cache written by its own ref or by the
      # DEFAULT BRANCH. A tag build therefore cannot use a cache that another tag
      # build wrote - it must have been seeded on main. That is automatic if the
      # release drill is followed: dispatch this workflow on main as a dry run
      # (which seeds), then push the tag (which restores). See docs/DEVELOPMENT.md.
      #
      # The key carries the runner IMAGE version, not just the triplet: MSVC and
      # the bundled vcpkg both ship with the image, so a static key would keep
      # restoring a tree built by an older toolchain after an image bump and fail
      # at link time - or, worse, subtly at runtime. ImageVersion is an OS env
      # var on the image, not part of the `env` expression context, so it has to
      # be captured in a step first.
      #
      # It also carries the PINNED libssh version. vcpkg's registry port is
      # 0.12.0, whose hybrid ML-KEM key exchange cannot pack its own client KEX
      # init ("Failed to construct client init buffer"), so the build takes
      # libssh from the in-tree overlay port instead. Without the version in the
      # key, an entry written before the pin would restore 0.12.0 and defeat it.
      - name: Resolve cache key (Windows)
        if: matrix.name == 'windows'
        id: imgver
        shell: pwsh
        run: |
          echo "v=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          # The vcpkg root is an image env var, so it is not reachable from the
          # `env` expression context either - capture it here so the cache step
          # and the install step below cannot drift apart.
          echo "vcpkg=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_OUTPUT
          $pin = (Get-Content packaging/vcpkg-ports/libssh/vcpkg.json | ConvertFrom-Json).version
          echo "libssh=$pin" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg libssh (Windows)
        if: matrix.name == 'windows'
        id: vcpkg_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.imgver.outputs.vcpkg }}\installed
          key: vcpkg-libssh-${{ steps.imgver.outputs.libssh }}-x64-windows-${{ steps.imgver.outputs.v }}

      - name: Install libssh via vcpkg (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          LIBSSH_PIN: ${{ steps.imgver.outputs.libssh }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:VCPKG_INSTALLATION_ROOT
          $header = "$root/installed/x64-windows/include/libssh/libssh_version.h"
          function Get-InstalledLibssh {
            if (-not (Test-Path $header)) { return $null }
            $text = Get-Content $header -Raw
            $parts = "MAJOR", "MINOR", "MICRO" | ForEach-Object {
              [regex]::Match($text, "LIBSSH_VERSION_$_\s+(\d+)").Groups[1].Value
            }
            return ($parts -join ".")
          }
          # A cache entry from before the pin (or a port bump) must not survive as
          # an already-installed tree that `vcpkg install` would treat as a no-op.
          $present = Get-InstalledLibssh
          if ($present -and $present -ne $env:LIBSSH_PIN) {
            Write-Host "Removing cached libssh $present (pin is $env:LIBSSH_PIN)"
            vcpkg remove libssh:x64-windows --recurse
          }
          vcpkg install libssh:x64-windows "--overlay-ports=$(Resolve-Path packaging/vcpkg-ports)"
          $installed = Get-InstalledLibssh
          if ($installed -ne $env:LIBSSH_PIN) {
            throw "libssh $installed installed, expected $env:LIBSSH_PIN; 0.12.0 cannot complete an SSH handshake."
          }
          Write-Host "libssh $installed"
          echo "CMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      # Save immediately: a later packaging failure must not throw away the
      # ten-minute dependency build that made this cache entry.
      - name: Save vcpkg libssh cache (Windows)
        if: matrix.name == 'windows' && steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.imgver.outputs.vcpkg }}\installed
          key: vcpkg-libssh-${{ steps.imgver.outputs.libssh }}-x64-windows-${{ steps.imgver.outputs.v }}

      # --- MSVC environment for the Ninja generator (Windows) ------------------
      - name: Set up MSVC (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The Monaco and xterm.js bundles are gitignored artifacts embedded as Qt
      # resources at CMake CONFIGURE time. src/qml/CMakeLists.txt raises a
      # FATAL_ERROR when they are missing and cannot be built, so this step is
      # what lets the configure step below run at all - and what keeps a shipped
      # binary from having editor/terminal panes with no page to load.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # BOTH bundles, via the root workspaces script: the terminal bundle is as
      # load-bearing as the editor one, and CMake's npm fallback that used to
      # cover it does not work on Windows.
      - name: Build web bundles (must precede CMake configure)
        # npm ci requires an up-to-date package-lock.json (installs from it strictly).
        run: npm ci && npm run build
        shell: bash

      # --- configure + build + test -------------------------------------------
      # CMake 3.21+ reads CMAKE_TOOLCHAIN_FILE from the environment (set by the
      # vcpkg step on Windows), so one command works on every OS. On Windows the
      # MSVC env from the previous step lets Ninja find cl.exe under bash.
      #
      # Build the release tree with tests enabled and test that exact tree before
      # packaging. The old flow built a Debug tree for tests and then rebuilt
      # every production target in Release, doubling the C++ work on Windows.
      - name: Configure (release preset, tests on)
        run: cmake --preset release-tests
        shell: bash

      - name: Build (release preset, tests on)
        run: cmake --build --preset release-tests
        shell: bash

      - name: Test (release preset)
        run: ctest --preset release-tests --verbose --output-on-failure --repeat until-pass:2
        shell: bash

      # --- package a runnable artifact per OS ----------------------------------
      # Raw Qt/WebEngine executables are NOT runnable off the runner; each OS has
      # its own deploy tool that bundles Qt libs, plugins, and WebEngine runtime.
      - name: Deploy (Linux, AppImage)
        if: matrix.name == 'linux'
        env:
          # Avoid depending on FUSE on the runner (ubuntu package naming varies).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          # BD25: linuxdeploy ships only a rolling `continuous` release (no
          # versioned tag to pin, unlike get-cmake/libssh above), so pin the two
          # tools by content hash and FAIL the release if either changes. An
          # upstream rebuild or a poisoned download can no longer silently alter
          # the Linux toolchain; bump these hashes deliberately (from each
          # release asset's `digest`) when the tools are intentionally updated.
          echo "e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "be1b7e166bf9975cfb694ebe6759ba40502ffc6196440d3e64aa90c4dbd67e9f  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy*.AppImage
          export QML_SOURCES_PATHS=$PWD/src/qml
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/release/src/app/codeharbor \
            --plugin qt \
            --output appimage \
            --desktop-file packaging/codeharbor.desktop \
            --icon-file packaging/codeharbor.svg
          mkdir -p artifact && mv CodeHarbor*.AppImage artifact/

      - name: Deploy (Windows, windeployqt)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $dest = "artifact/codeharbor-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Qt's qt_standard_project_setup redirects RUNTIME_OUTPUT_DIRECTORY to
          # the build root on Windows so the exe sits beside its DLLs, so it is
          # NOT under src/app/ as it is on Linux/macOS. Locate it rather than
          # assume a layout that varies by platform.
          $exe = Get-ChildItem -Path build/release -Recurse -Filter codeharbor.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "codeharbor.exe not found under build/release" }
          Copy-Item $exe.FullName $dest/
          windeployqt --qmldir src/qml --release "$dest/codeharbor.exe"
          # Bundle non-Qt runtime deps (libssh) next to the exe.
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" |
            ForEach-Object { Copy-Item $_.FullName $dest/ }

      # --- Windows installer (Inno Setup) --------------------------------------
      # The step above leaves a portable extract-and-run tree. That stays exactly
      # as it was - it is the `codeharbor-windows` artifact other tooling already
      # points at, and some users want a no-install copy. This step packages the
      # SAME tree into a per-user installer so a normal Windows user gets
      # shortcuts, an "Installed apps" entry, and upgrade-in-place instead of
      # "extract a zip somewhere and delete the old folder by hand".
      #
      # Why the script carries no version: packaging/windows/codeharbor.iss reads
      # it from /DAppVersion, and the value is parsed here out of the top-level
      # CMakeLists.txt - the single source of truth that
      # .omp/skills/bump-version/bump.sh rewrites. Nothing about the installer has
      # to be bumped separately, which is deliberate: a version the bump script
      # misses has already bitten this project once.
      - name: Build installer (Windows, Inno Setup)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cmake = Get-Content CMakeLists.txt -Raw
          $m = [regex]::Match($cmake, 'project\(CodeHarbor[\s\S]*?VERSION\s+(\d+\.\d+\.\d+)')
          if (-not $m.Success) {
            throw "could not parse the project() VERSION out of CMakeLists.txt; the installer refuses to guess a version."
          }
          $version = $m.Groups[1].Value
          Write-Host "Installer version (from CMakeLists.txt): $version"

          # ISCC is the Inno Setup command-line compiler. The runner image ships
          # Inno Setup (6.7.1 at the time of writing) but it has been absent from
          # some windows-2025 image revisions and is not always on PATH, so
          # resolve it, and install it if it is genuinely missing rather than
          # skipping the installer and producing a green run with nothing in it.
          function Resolve-Iscc {
            # Chocolatey puts a shim named ISCC.exe ahead of the real compiler
            # on PATH; prefer the installation paths so the compiler itself runs.
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                             "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { return $p }
            }
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return $null
          }
          $iscc = Resolve-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not present on this image; installing it."
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
            $iscc = Resolve-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }

          # Inno's ISCC binary reports a zero file version on the hosted
          # runner, so FileVersionRaw cannot validate the compiler. The
          # authoritative compatibility check is the compilation below:
          # unsupported directives make ISCC fail instead of producing an
          # installer.
          Write-Host "Using ISCC $iscc"

          $src = (Resolve-Path "artifact/codeharbor-windows").Path
          $out = Join-Path (Get-Location).Path "installer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & $iscc "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$out" `
                  "packaging/windows/codeharbor.iss"
          # $ErrorActionPreference does not apply to a native process's exit code,
          # so check it explicitly or a failed compile would pass silently.
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE; no Windows installer was produced."
          }

          $setup = @(Get-ChildItem $out -Filter "*.exe")
          if ($setup.Count -ne 1) {
            throw "expected exactly one installer in $out, found $($setup.Count)"
          }
          Write-Host ("Built {0} ({1:N1} MB)" -f $setup[0].Name, ($setup[0].Length / 1MB))

      # Uploaded as its own artifact so the `codeharbor-windows` artifact above
      # keeps exactly the contents (and path) it has always had. `publish` pulls
      # every artifact into one directory with merge-multiple, so both end up
      # attached to the release.
      - name: Upload installer artifact (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-windows-installer
          path: installer/
          if-no-files-found: error

      - name: Deploy (macOS, macdeployqt)
        if: matrix.name == 'macos'
        run: |
          APP=build/release/src/app/codeharbor.app
          macdeployqt "$APP" -qmldir=src/qml -dmg
          mkdir -p artifact && mv build/release/src/app/codeharbor.dmg artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error

  # The remote service (codeharbord + bridge) is platform-independent JS: it
  # runs on the SSH dev server under Node, so it is packaged once, not per OS.
  remote:
    name: remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build remote workspace
        working-directory: remote
        run: |
          # npm ci requires an up-to-date package-lock.json (installs from it strictly).
          npm ci
          npm test
          npm run build
      - name: Package
        working-directory: remote
        run: |
          mkdir -p ../artifact
          tar -czf ../artifact/codeharbor-remote.tar.gz dist package.json sql
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-remote
          path: artifact/
          if-no-files-found: error

  # The build/remote jobs only upload workflow ARTIFACTS, which expire and are
  # invisible to logged-out users. This job is what actually puts binaries on the
  # Releases page, and it runs for tag builds only - a manual workflow_dispatch
  # stays a dry run that exercises the cross-OS builds without publishing.
  publish:
    name: publish release
    needs: [build, remote]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Windows deploy step produces a DIRECTORY (exe + Qt runtime + libssh
      # DLLs); `gh release create` only accepts files, so fold it into one zip.
      # The Windows installer is already a single .exe and passes through as-is.
      - name: Normalise assets
        run: |
          cd dist
          for d in */; do
            [ -d "$d" ] || continue
            zip -r "${d%/}.zip" "$d"
            rm -rf "$d"
          done
          ls -la

      # A release missing the Windows installer is a release most Windows users
      # cannot install, and a silently absent asset is worse than a red run: the
      # tag is permanent. Assert both Windows assets before anything is published.
      - name: Verify Windows assets are present
        run: |
          set -eu
          for pattern in 'codeharbor-windows.zip' 'CodeHarbor-*-windows-x64-setup.exe'; do
            matches=$(find dist -maxdepth 1 -name "$pattern" | wc -l)
            [ "$matches" -eq 1 ] || {
              echo "expected exactly one dist/$pattern, found $matches" >&2
              exit 1
            }
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CodeHarbor $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
