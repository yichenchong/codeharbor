name: Release

# Cross-OS binaries are produced by building NATIVELY on each OS. Qt WebEngine
# (Chromium) cannot be cross-compiled, so there is one runner per target OS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false

env:
  # Must be >= the CMake floor (6.9). 6.8.1 predates
  # QQuickWebEngineProfile(storageName, parent) and does not compile.
  QT_VERSION: "6.9.*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # qtpositioning is a hard dependency of Qt6WebEngineCore; omitting it
          # fails find_package(Qt6 COMPONENTS WebEngineCore) at configure time.
          #
          # qtserialport is needed only to PACKAGE, not to build: installing
          # qtpositioning makes linuxdeploy's qt plugin bundle the position
          # plugins, and libqtposition_nmea.so links libQt6SerialPort.so.6.
          # Without it the AppImage step dies on an unresolved dependency.
          modules: qtwebengine qtwebchannel qtpositioning qtserialport
          cache: true

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      # --- libssh per platform -------------------------------------------------
      - name: Install libssh (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Install libssh (macOS)
        if: matrix.name == 'macos'
        run: |
          brew install libssh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libssh):${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

      # libssh is built FROM SOURCE by vcpkg and dominated this job at ~9.8 min
      # of a 13.7 min run (the compile itself is ~1.6 min). The built tree is
      # deterministic for a given triplet, so cache it; a hit turns the install
      # below into a no-op.
      - name: Cache vcpkg libssh (Windows)
        if: matrix.name == 'windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libssh-x64-windows-v1

      - name: Install libssh via vcpkg (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          vcpkg install libssh:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      # --- MSVC environment for the Ninja generator (Windows) ------------------
      - name: Set up MSVC (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The Monaco bundle is a gitignored artifact embedded as a Qt resource at
      # CMake CONFIGURE time, so it must exist before the configure step below or
      # the shipped binary's editor pane has no page to load.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # BOTH bundles, via the root workspaces script: the terminal bundle is as
      # load-bearing as the editor one, and CMake's npm fallback that used to
      # cover it does not work on Windows.
      - name: Build web bundles (must precede CMake configure)
        run: npm install && npm run build
        shell: bash

      # --- configure + build ---------------------------------------------------
      # CMake 3.21+ reads CMAKE_TOOLCHAIN_FILE from the environment (set by the
      # vcpkg step on Windows), so one command works on every OS. On Windows the
      # MSVC env from the previous step lets Ninja find cl.exe under bash.
      - name: Configure
        run: cmake --preset release
        shell: bash

      - name: Build
        run: cmake --build --preset release
        shell: bash

      # --- package a runnable artifact per OS ----------------------------------
      # Raw Qt/WebEngine executables are NOT runnable off the runner; each OS has
      # its own deploy tool that bundles Qt libs, plugins, and WebEngine runtime.
      - name: Deploy (Linux, AppImage)
        if: matrix.name == 'linux'
        env:
          # Avoid depending on FUSE on the runner (ubuntu package naming varies).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QML_SOURCES_PATHS=$PWD/src/qml
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/release/src/app/codeharbor \
            --plugin qt \
            --output appimage \
            --desktop-file packaging/codeharbor.desktop \
            --icon-file packaging/codeharbor.svg
          mkdir -p artifact && mv CodeHarbor*.AppImage artifact/

      - name: Deploy (Windows, windeployqt)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $dest = "artifact/codeharbor-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Qt's qt_standard_project_setup redirects RUNTIME_OUTPUT_DIRECTORY to
          # the build root on Windows so the exe sits beside its DLLs, so it is
          # NOT under src/app/ as it is on Linux/macOS. Locate it rather than
          # assume a layout that varies by platform.
          $exe = Get-ChildItem -Path build/release -Recurse -Filter codeharbor.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "codeharbor.exe not found under build/release" }
          Copy-Item $exe.FullName $dest/
          windeployqt --qmldir src/qml --release "$dest/codeharbor.exe"
          # Bundle non-Qt runtime deps (libssh) next to the exe.
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" |
            ForEach-Object { Copy-Item $_.FullName $dest/ }

      - name: Deploy (macOS, macdeployqt)
        if: matrix.name == 'macos'
        run: |
          APP=build/release/src/app/codeharbor.app
          macdeployqt "$APP" -qmldir=src/qml -dmg
          mkdir -p artifact && mv build/release/src/app/codeharbor.dmg artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error

  # The remote service (codeharbord + bridge) is platform-independent JS: it
  # runs on the SSH dev server under Node, so it is packaged once, not per OS.
  remote:
    name: remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build remote workspace
        working-directory: remote
        run: |
          npm install
          npm test
          npm run build
      - name: Package
        working-directory: remote
        run: |
          mkdir -p ../artifact
          tar -czf ../artifact/codeharbor-remote.tar.gz dist package.json sql
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-remote
          path: artifact/
          if-no-files-found: error

  # The build/remote jobs only upload workflow ARTIFACTS, which expire and are
  # invisible to logged-out users. This job is what actually puts binaries on the
  # Releases page, and it runs for tag builds only - a manual workflow_dispatch
  # stays a dry run that exercises the cross-OS builds without publishing.
  publish:
    name: publish release
    needs: [build, remote]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Windows deploy step produces a DIRECTORY (exe + Qt runtime + libssh
      # DLLs); `gh release create` only accepts files, so fold it into one zip.
      - name: Normalise assets
        run: |
          cd dist
          for d in */; do
            [ -d "$d" ] || continue
            zip -r "${d%/}.zip" "$d"
            rm -rf "$d"
          done
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CodeHarbor $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
