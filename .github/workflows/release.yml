name: Release

# Cross-OS binaries are produced by building NATIVELY on each OS. Qt WebEngine
# (Chromium) cannot be cross-compiled, so there is one runner per target OS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false

# Only `publish` needs write access, and it grants itself `contents: write`
# below. Everything else (three OS builders + the remote packager) is read-only.
permissions:
  contents: read

# A tag's run must never race a second run of itself. That happens for real: a
# re-run requested from the Actions UI while the first attempt is still going,
# or a tag that is deleted and re-pushed. Two live runs would both reach
# `publish`, and `gh release upload --clobber` from two directions can leave the
# release page holding one job's Windows zip beside the other's installer.
#
# cancel-in-progress is deliberately FALSE: a half-finished publish that is
# killed mid-upload is worse than a queued duplicate that finds the assets
# already correct. The later run simply waits and then re-uploads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must be >= the CMake floor (6.9). 6.8.1 predates
  # QQuickWebEngineProfile(storageName, parent) and does not compile.
  QT_VERSION: "6.9.*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # GitHub's default job timeout is SIX HOURS. A Qt WebEngine build that wedges
    # - a vcpkg source build stuck on a prompt, a hung ctest - would otherwise
    # hold a runner for that long before the release is even reported as failed.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The release version, resolved ONCE for every platform out of the single
      # source of truth that .omp/skills/bump-version/bump.sh rewrites. Each
      # deploy step below stamps it into the artifact's filename, and the
      # `publish` job then requires every one of those names to match the tag —
      # which is what catches a tag pushed at a tree whose CMakeLists.txt was
      # never bumped. Previously only the Windows installer carried a version,
      # so the AppImage and the disk image could not be checked at all.
      - name: Resolve the release version
        shell: bash
        run: |
          set -euo pipefail
          # Anchored on the project() call, exactly like the check in
          # .bumpversion.json, so an unrelated `VERSION` elsewhere in the file
          # can never be picked up. No pipe: `set -o pipefail` plus a `head`
          # that closes early is a SIGPIPE waiting to happen.
          version=$(sed -n '/^project(CodeHarbor/,/)/ s/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\).*$/\1/p' CMakeLists.txt)
          version=${version%%$'\n'*}
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "could not parse the project() VERSION out of CMakeLists.txt (got '$version');" >&2
              echo "the release refuses to name its artifacts after a guess." >&2
              exit 1
              ;;
          esac
          echo "Release version (from CMakeLists.txt): $version"
          echo "CH_VERSION=$version" >> "$GITHUB_ENV"

      # Pinned to an exact release for the same reason as get-cmake below: `@v4`
      # is a tag this third-party action's author moves, so the Qt installer that
      # produces published binaries could change with no commit here. v4.3.1 is
      # what `@v4` resolves to today; bump it deliberately.
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          # qtpositioning is a hard dependency of Qt6WebEngineCore; omitting it
          # fails find_package(Qt6 COMPONENTS WebEngineCore) at configure time.
          #
          # qtserialport is needed only to PACKAGE, not to build: installing
          # qtpositioning makes linuxdeploy's qt plugin bundle the position
          # plugins, and libqtposition_nmea.so links libQt6SerialPort.so.6.
          # Without it the AppImage step dies on an unresolved dependency.
          modules: qtwebengine qtwebchannel qtpositioning qtserialport
          cache: true

      # Pinned, not `@latest`: get-cmake's `latest` tag moves with every CMake
      # release, so a floating ref silently changes the CMake that builds the
      # published artifacts. v4.2.3 is the version docs/DEVELOPMENT.md records as
      # verified for this tree; bump it deliberately, together with that table.
      - name: Install CMake + Ninja
        uses: lukka/get-cmake@v4.2.3

      # --- libssh per platform -------------------------------------------------
      - name: Install libssh (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Install libssh (macOS)
        if: matrix.name == 'macos'
        run: |
          brew install libssh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libssh):${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

      # libssh is built FROM SOURCE by vcpkg and dominated this job at ~9.8 min
      # of a 13.7 min run (the compile itself is ~1.6 min). The built tree is
      # deterministic for a given triplet, so cache it; a hit turns the install
      # below into a no-op.
      #
      # SCOPING: a run can only restore a cache written by its own ref or by the
      # DEFAULT BRANCH. A tag build therefore cannot use a cache that another tag
      # build wrote - it must have been seeded on main. That is automatic if the
      # release drill is followed: dispatch this workflow on main as a dry run
      # (which seeds), then push the tag (which restores). See docs/DEVELOPMENT.md.
      #
      # The key carries the runner IMAGE version, not just the triplet: MSVC and
      # the bundled vcpkg both ship with the image, so a static key would keep
      # restoring a tree built by an older toolchain after an image bump and fail
      # at link time - or, worse, subtly at runtime. ImageVersion is an OS env
      # var on the image, not part of the `env` expression context, so it has to
      # be captured in a step first.
      #
      # It also carries the PINNED libssh version and a hash of every file in the
      # overlay port. The hash is required because changing a patch without
      # bumping the upstream version must force a rebuild; otherwise vcpkg treats
      # the restored install as a no-op and silently ships the old patched tree.
      # The registry port is 0.12.0, whose hybrid ML-KEM key exchange cannot pack
      # its own client KEX init, so the build takes libssh from the in-tree 0.12.2
      # overlay port instead.
      - name: Resolve cache key (Windows)
        if: matrix.name == 'windows'
        id: imgver
        shell: pwsh
        run: |
          echo "v=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          # The vcpkg root is an image env var, so it is not reachable from the
          # `env` expression context either - capture it here so the cache step
          # and the install step below cannot drift apart.
          echo "vcpkg=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_OUTPUT
          $pin = (Get-Content packaging/vcpkg-ports/libssh/vcpkg.json | ConvertFrom-Json).version
          echo "libssh=$pin" >> $env:GITHUB_OUTPUT

      # cache/restore, NOT the combined `actions/cache`: the combined action
      # registers a post-job save under the same key, which collides with the
      # explicit save step below ("cache already exists"). The explicit save is
      # the one that matters here - see its comment.
      - name: Cache vcpkg libssh (Windows)
        if: matrix.name == 'windows'
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.imgver.outputs.vcpkg }}\installed
          key: vcpkg-libssh-${{ steps.imgver.outputs.libssh }}-x64-windows-${{ steps.imgver.outputs.v }}-${{ hashFiles('packaging/vcpkg-ports/libssh/**') }}

      - name: Install libssh via vcpkg (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          LIBSSH_PIN: ${{ steps.imgver.outputs.libssh }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:VCPKG_INSTALLATION_ROOT
          $header = "$root/installed/x64-windows/include/libssh/libssh_version.h"
          function Get-InstalledLibssh {
            if (-not (Test-Path $header)) { return $null }
            $text = Get-Content $header -Raw
            $parts = "MAJOR", "MINOR", "MICRO" | ForEach-Object {
              [regex]::Match($text, "LIBSSH_VERSION_$_\s+(\d+)").Groups[1].Value
            }
            return ($parts -join ".")
          }
          # A cache entry from before the pin (or a port bump) must not survive as
          # an already-installed tree that `vcpkg install` would treat as a no-op.
          $present = Get-InstalledLibssh
          if ($present -and $present -ne $env:LIBSSH_PIN) {
            Write-Host "Removing cached libssh $present (pin is $env:LIBSSH_PIN)"
            vcpkg remove libssh:x64-windows --recurse
          }
          vcpkg install libssh:x64-windows "--overlay-ports=$(Resolve-Path packaging/vcpkg-ports)"
          $installed = Get-InstalledLibssh
          if ($installed -ne $env:LIBSSH_PIN) {
            throw "libssh $installed installed, expected $env:LIBSSH_PIN; 0.12.0 cannot complete an SSH handshake."
          }
          Write-Host "libssh $installed"
          echo "CMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      # Save immediately: a later packaging failure must not throw away the
      # ten-minute dependency build that made this cache entry.
      - name: Save vcpkg libssh cache (Windows)
        if: matrix.name == 'windows' && steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.imgver.outputs.vcpkg }}\installed
          key: vcpkg-libssh-${{ steps.imgver.outputs.libssh }}-x64-windows-${{ steps.imgver.outputs.v }}-${{ hashFiles('packaging/vcpkg-ports/libssh/**') }}

      # --- MSVC environment for the Ninja generator (Windows) ------------------
      # Pinned to an exact release: `@v1` is a moving tag on a third-party action
      # that decides which MSVC toolchain compiles the published Windows binary.
      - name: Set up MSVC (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # The Monaco, xterm.js and Markdown bundles are gitignored artifacts
      # embedded as Qt resources at CMake CONFIGURE time. src/qml/CMakeLists.txt
      # raises a FATAL_ERROR when they are missing and cannot be built, so this
      # step is what lets the configure step below run at all - and what keeps a
      # shipped binary from having editor, terminal or Markdown panes with no
      # page to load.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # ~/.npm across runs; the bundle install is Monaco, xterm.js and
          # Markdown dependencies.
          cache: npm
      # All three bundles, via the root workspaces script: the terminal and
      # Markdown bundles are as load-bearing as the editor one, and CMake's npm
      # fallback that used to cover one of them does not work on Windows.
      - name: Build web bundles (must precede CMake configure)
        # npm ci requires an up-to-date package-lock.json (installs from it strictly).
        run: npm ci && npm run build
        shell: bash

      # BD26: the release path must not be WEAKER than the ordinary one. ci.yml
      # type-checks and tests all three bundles; esbuild strips types without
      # checking them, so a TS error anywhere in src/web/* passes the bundle build
      # and would otherwise reach a published binary unreported. Tags are cut
      # from `main`, which CI has gated - but a tag can be cut from any ref via
      # workflow_dispatch, and "the other workflow already checked it" is not a
      # check.
      - name: Typecheck web bundles
        run: npm run typecheck
        shell: bash
      - name: Test web bundles
        run: npm test --workspace src/web/terminal --workspace src/web/editor --workspace src/web/markdown
        shell: bash

      # --- configure + build + test -------------------------------------------
      # CMake 3.21+ reads CMAKE_TOOLCHAIN_FILE from the environment (set by the
      # vcpkg step on Windows), so one command works on every OS. On Windows the
      # MSVC env from the previous step lets Ninja find cl.exe under bash.
      #
      # Build the release tree with tests enabled and test that exact tree before
      # packaging. The old flow built a Debug tree for tests and then rebuilt
      # every production target in Release, doubling the C++ work on Windows.
      - name: Configure (release preset, tests on)
        run: cmake --preset release-tests
        shell: bash

      - name: Build (release preset, tests on)
        run: cmake --build --preset release-tests
        shell: bash

      - name: Test (release preset)
        # Keep the preset's output-on-failure setting explicit: child-process
        # tests must show their diagnostic output on native runners.
        #
        # NO `--repeat until-pass`. It used to be `until-pass:2`, which reports a
        # test that fails once and passes on the retry as a pass. ci.yml runs the
        # same suite with no retry, so the release path was the WEAKER of the two
        # - the exact thing the typecheck/test steps above exist to prevent - and
        # an intermittent failure could be silently carried into a permanent tag.
        run: ctest --preset release-tests --output-on-failure
        shell: bash

      # --- package a runnable artifact per OS ----------------------------------
      # Raw Qt/WebEngine executables are NOT runnable off the runner; each OS has
      # its own deploy tool that bundles Qt libs, plugins, and WebEngine runtime.
      - name: Deploy (Linux, AppImage)
        if: matrix.name == 'linux'
        env:
          # Avoid depending on FUSE on the runner (ubuntu package naming varies).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          # BD25: linuxdeploy ships only a rolling `continuous` release (no
          # versioned tag to pin, unlike get-cmake/libssh above), so pin the two
          # tools by content hash and FAIL the release if either changes. An
          # upstream rebuild or a poisoned download can no longer silently alter
          # the Linux toolchain; bump these hashes deliberately (from each
          # release asset's `digest`) when the tools are intentionally updated.
          echo "421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "be1b7e166bf9975cfb694ebe6759ba40502ffc6196440d3e64aa90c4dbd67e9f  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy*.AppImage
          export QML_SOURCES_PATHS=$PWD/src/qml
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/release/src/app/codeharbor \
            --plugin qt \
            --output appimage \
            --desktop-file packaging/codeharbor.desktop \
            --icon-file packaging/codeharbor.svg
          # One deterministic name, carrying the version, so `publish` can
          # require it to equal the tag. linuxdeploy's own output name depends
          # on environment it reads for itself, so do not rely on it: match
          # exactly one file and rename it.
          mkdir -p artifact
          shopt -s nullglob
          built=(CodeHarbor*.AppImage)
          if [ "${#built[@]}" -ne 1 ]; then
            echo "expected exactly one AppImage from linuxdeploy, found ${#built[@]}: ${built[*]-}" >&2
            exit 1
          fi
          mv "${built[0]}" "artifact/CodeHarbor-$CH_VERSION-x86_64.AppImage"

      - name: Deploy (Windows, windeployqt)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "artifact/codeharbor-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Qt's qt_standard_project_setup redirects RUNTIME_OUTPUT_DIRECTORY to
          # the build root on Windows so the exe sits beside its DLLs, so it is
          # NOT under src/app/ as it is on Linux/macOS. Locate it rather than
          # assume a layout that varies by platform.
          $exe = Get-ChildItem -Path build/release -Recurse -Filter codeharbor.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "codeharbor.exe not found under build/release" }
          Copy-Item $exe.FullName $dest/
          windeployqt --qmldir src/qml --release "$dest/codeharbor.exe"
          # windeployqt is a native process, so neither $ErrorActionPreference
          # nor a `throw` elsewhere covers its exit code (the Inno Setup step
          # below checks its compiler for exactly this reason). Without this,
          # a failed deploy left an artifact holding codeharbor.exe and none of
          # the Qt runtime it needs: `if-no-files-found: error` still passes,
          # so the first person to notice would be a user downloading a
          # published release that cannot start.
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE; the portable Windows tree has no Qt runtime."
          }
          # Bundle non-Qt runtime deps (libssh) next to the exe.
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" |
            ForEach-Object { Copy-Item $_.FullName $dest/ }

      # --- Windows installer (Inno Setup) --------------------------------------
      # The step above leaves a portable extract-and-run tree. That stays exactly
      # as it was - it is the `codeharbor-windows` artifact other tooling already
      # points at, and some users want a no-install copy. This step packages the
      # SAME tree into a per-user installer so a normal Windows user gets
      # shortcuts, an "Installed apps" entry, and upgrade-in-place instead of
      # "extract a zip somewhere and delete the old folder by hand".
      #
      # Why the script carries no version: packaging/windows/codeharbor.iss reads
      # it from /DAppVersion, and the value comes from the "Resolve the release
      # version" step at the top of this job, which parses the top-level
      # CMakeLists.txt - the single source of truth that
      # .omp/skills/bump-version/bump.sh rewrites. Nothing about the installer has
      # to be bumped separately, which is deliberate: a version the bump script
      # misses has already bitten this project once.
      #
      # It used to re-parse CMakeLists.txt here with a second, PowerShell copy of
      # the same regular expression. One parser, used by every platform, is one
      # fewer thing that can drift.
      - name: Build installer (Windows, Inno Setup)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:CH_VERSION
          if (-not $version) {
            throw "CH_VERSION is not set; the 'Resolve the release version' step did not run."
          }
          Write-Host "Installer version (from CMakeLists.txt): $version"

          # ISCC is the Inno Setup command-line compiler. The runner image ships
          # Inno Setup (6.7.1 at the time of writing) but it has been absent from
          # some windows-2025 image revisions and is not always on PATH, so
          # resolve it, and install it if it is genuinely missing rather than
          # skipping the installer and producing a green run with nothing in it.
          function Resolve-Iscc {
            # Chocolatey puts a shim named ISCC.exe ahead of the real compiler
            # on PATH; prefer the installation paths so the compiler itself runs.
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                             "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { return $p }
            }
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return $null
          }
          $iscc = Resolve-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not present on this image; installing it."
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
            $iscc = Resolve-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }

          # Inno's ISCC binary reports a zero file version on the hosted
          # runner, so FileVersionRaw cannot validate the compiler. The
          # authoritative compatibility check is the compilation below:
          # unsupported directives make ISCC fail instead of producing an
          # installer.
          Write-Host "Using ISCC $iscc"

          $src = (Resolve-Path "artifact/codeharbor-windows").Path
          $out = Join-Path (Get-Location).Path "installer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & $iscc "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$out" `
                  "packaging/windows/codeharbor.iss"
          # $ErrorActionPreference does not apply to a native process's exit code,
          # so check it explicitly or a failed compile would pass silently.
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE; no Windows installer was produced."
          }

          $setup = @(Get-ChildItem $out -Filter "*.exe")
          if ($setup.Count -ne 1) {
            throw "expected exactly one installer in $out, found $($setup.Count)"
          }
          Write-Host ("Built {0} ({1:N1} MB)" -f $setup[0].Name, ($setup[0].Length / 1MB))

      # Uploaded as its own artifact so the `codeharbor-windows` artifact above
      # keeps exactly the contents (and path) it has always had. `publish` pulls
      # every artifact into one directory with merge-multiple, so both end up
      # attached to the release.
      - name: Upload installer artifact (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-windows-installer
          path: installer/
          if-no-files-found: error

      # The disk image is renamed to carry the version and the CPU architecture.
      # macdeployqt names it after the bundle alone (`codeharbor.dmg`), which
      # said nothing about what was inside it: `macos-latest` is Apple silicon,
      # so a generically named image was silently arm64-only, and the version
      # could not be checked against the tag the way the Windows installer's can.
      - name: Deploy (macOS, macdeployqt)
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          APP=build/release/src/app/codeharbor.app
          macdeployqt "$APP" -qmldir=src/qml -dmg
          mkdir -p artifact
          mv build/release/src/app/codeharbor.dmg \
             "artifact/CodeHarbor-$CH_VERSION-macos-$(uname -m).dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error

  # The remote service (codeharbord + bridge) is platform-independent JS: it
  # runs on the SSH dev server under Node, so it is packaged once, not per OS.
  remote:
    name: remote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # BEFORE npm ci, exactly as in ci.yml: `npm ci` rewrites a workspace
      # package.json's own `version` field to whatever package-lock.json says, so
      # a lock that lagged the manifests would silently ship the WRONG version
      # inside this job's codeharbor-remote.tar.gz — under a release named after
      # the tag. The `publish` job's version assertion only covers the Windows
      # installer, so nothing else here would catch it.
      - name: Versions agree across CMakeLists, manifests and the lock
        run: node .github/scripts/check-versions.mjs
      - name: Build remote workspace
        working-directory: remote
        run: |
          # npm ci requires an up-to-date package-lock.json (installs from it strictly).
          npm ci
          # `npm run typecheck` explicitly, as ci.yml does. `npm run build` is a
          # type checker only by accident of using tsc today; a switch to a
          # transpile-only bundler here would silently drop the check from the
          # release path while leaving it in the ordinary one.
          npm run typecheck
          npm test
          npm run build
      - name: Package
        working-directory: remote
        run: |
          mkdir -p ../artifact
          tar -czf ../artifact/codeharbor-remote.tar.gz dist package.json sql
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeharbor-remote
          path: artifact/
          if-no-files-found: error

  # The build/remote jobs only upload workflow ARTIFACTS, which expire and are
  # invisible to logged-out users. This job is what actually puts binaries on the
  # Releases page, and it runs for PUSHED TAGS only - a manual workflow_dispatch
  # stays a dry run that exercises the cross-OS builds without publishing.
  #
  # The `github.event_name == 'push'` half is load-bearing and not belt-and-
  # braces. workflow_dispatch can be started from a TAG in the Actions UI, and
  # then `github.ref` is that tag: the ref test alone would let a dry run publish
  # a real release. Worse, the builders check out `inputs.ref || github.ref`, so
  # a dispatch on tag v1.2.3 with `ref` set to some branch would attach that
  # branch's binaries to the v1.2.3 release page.
  publish:
    name: publish release
    needs: [build, remote]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Windows deploy step produces a DIRECTORY (exe + Qt runtime + libssh
      # DLLs); `gh release create` only accepts files, so fold it into one zip.
      # The Windows installer is already a single .exe and passes through as-is.
      - name: Normalise assets
        run: |
          set -euo pipefail
          cd dist
          for d in */; do
            [ -d "$d" ] || continue
            zip -r "${d%/}.zip" "$d"
            rm -rf "$d"
          done
          ls -la

      # A silently absent asset is worse than a red run, because the tag is
      # permanent: a release missing the Windows installer is a release most
      # Windows users cannot install, and one missing the remote tarball is a
      # client with no server to talk to. Every expected asset is asserted, not
      # only the two Windows ones - the other three were unchecked, and the
      # matrix's `fail-fast: false` means a job can go red without stopping the
      # others, so "the build job succeeded" is not the same statement.
      #
      # Three of the names carry the version each build job read out of
      # CMakeLists.txt, so requiring them to equal the TAG also catches the one
      # mistake nothing else here would: tagging v0.2.0 on a tree whose
      # CMakeLists.txt still says 0.1.8. That would publish, under the v0.2.0
      # release, an installer that names and registers itself as 0.1.8 in
      # "Installed apps" - a wrong version is worse than a missing one, because
      # it looks fine.
      #
      # The macOS image is matched by a pattern only because its architecture is
      # whatever the `macos-latest` runner is; its version is still pinned.
      - name: Verify every asset is present and versioned like the tag
        run: |
          set -euo pipefail
          # No pathname expansion: the list below deliberately contains a glob
          # that `find` must receive verbatim, not one the shell resolves first.
          set -f
          version="${GITHUB_REF_NAME#v}"
          expected="
          codeharbor-windows.zip
          CodeHarbor-$version-windows-x64-setup.exe
          CodeHarbor-$version-x86_64.AppImage
          CodeHarbor-$version-macos-*.dmg
          codeharbor-remote.tar.gz
          "
          missing=0
          for name in $expected; do
            matches=$(find dist -maxdepth 1 -name "$name" | wc -l)
            if [ "$matches" -ne 1 ]; then
              echo "expected exactly one dist/$name, found $matches" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "assets present:" >&2
            ls -1 dist >&2
            exit 1
          fi

      # Checksums, so a download can be verified against something the release
      # itself publishes. Generated here rather than per build job because this
      # is the only place that sees every artifact at once, and it runs AFTER
      # the verification above so the file can never list a partial release.
      # `cd dist` keeps the names in the file bare, which is what
      # `sha256sum -c SHA256SUMS.txt` expects next to the downloads.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * >../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every other bash step in this workflow is strict; this one was not,
          # so an unset variable expanded to an empty asset list rather than
          # stopping the publish.
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A retry after a published release exists must replace its assets
            # instead of failing at `gh release create`.
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CodeHarbor $GITHUB_REF_NAME" \
              --target "$GITHUB_SHA"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CodeHarbor $GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
